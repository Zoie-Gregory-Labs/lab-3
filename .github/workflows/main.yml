name: HR Management System CI

on: push

jobs:
  build:
    name: Build and Test HR System
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Unit Tests
        run: mvn -Dtest=AppTest test

      - name: Package and Build Docker Compose
        run: |
          mvn package -DskipTests
          docker compose build